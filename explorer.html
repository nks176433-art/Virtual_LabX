<!DOCTYPE html>
<html>
<head>
    <title>Explore - Little Scientists</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #05070b;
            color: white;
            text-align: center;
        }

        .container {
            padding-top: 100px;
        }

        h1 {
            font-size: 50px;
            color: #9ec5e8;
        }

        p {
            font-size: 20px;
            color: #aeb6c2;
        }

        .mission {
            margin: 50px auto;
            padding: 30px;
            width: 500px;
            background: #101722;
            border: 1px solid #26384d;
            border-radius: 15px;
        }

        button {
            padding: 15px 30px;
            margin-top: 20px;
            background: #9ec5e8;
            color: #05070b;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome, Scientist 🧪</h1>

        <p>Your journey of discovery begins here.</p>

        <div class="mission">

            <h2>🔬 Choose Your Mission</h2>

            <p>
                Investigate mysteries, perform experiments,
                collect evidence and solve scientific problems.
            </p>

            <button>
                BEGIN FIRST MISSION
            </button>

        </div>

    </div>

</body>
</html>
